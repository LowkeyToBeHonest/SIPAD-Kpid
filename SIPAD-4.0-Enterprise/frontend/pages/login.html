<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login SIPAD</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="../css/style.css" rel="stylesheet"><script src="../js/theme.js"></script><link rel="icon" type="image/jpeg" href="../assets/icons/kpid-logo.jpeg">
<style>@media(max-width:480px){body{padding:16px}.card{width:100%!important;padding:24px!important}.card h3{font-size:24px}.form-control{min-height:48px}}</style>
</head><body class="bg-light d-flex align-items-center justify-content-center" style="min-height:100vh"><div class="card p-4 shadow" style="width:380px"><div class="text-center mb-3"><img src="../assets/icons/kpid-logo.jpeg" alt="Logo KPID" style="width:76px;height:76px;object-fit:contain;border-radius:18px"><h3 class="mt-3 mb-1">Masuk ke SIPAD</h3><small class="text-muted">Sistem Informasi Pengarsipan Digital</small></div><label class="form-label" for="email">Email</label><input id="email" class="form-control mb-3" placeholder="nama@kpid.go.id" autocomplete="username"><label class="form-label" for="password">Password</label><input id="password" type="password" class="form-control mb-3" placeholder="Masukkan password" autocomplete="current-password"><button class="btn btn-primary w-100" onclick="login()">Masuk</button></div><script src="../js/config.js"></script><script src="../js/api.js"></script><script src="../js/auth.js"></script></body></html>
