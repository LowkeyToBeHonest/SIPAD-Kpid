<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pengguna | SIPAD</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <link href="../css/bootstrap-custom.css" rel="stylesheet">
  <script src="../js/theme.js"></script>
  <script src="../js/auth-guard.js"></script>
  <script>guardSession();</script>

  <link rel="icon" type="image/jpeg" href="../assets/icons/kpid-logo.jpeg">
</head>

<body>
  
<!-- Mobile Menu -->
<button id="menuToggle" class="mobile-menu-btn" aria-label="Buka menu">☰</button>
<div id="sidebarOverlay" class="sidebar-overlay"></div>


<div class="app-shell">

  <!-- SIDEBAR -->
    <aside class="app-sidebar" id="sidebar">

    <div>

      <div class="brand">
        <div class="brand-mark">
          <img src="../assets/icons/kpid-logo.jpeg" alt="Logo KPID">
        </div>

        <div class="brand-copy">
          <strong>SIPAD</strong>
          <small>Enterprise 4.0</small>
        </div>
      </div>

      <div class="sidebar-label">WORKSPACE</div>

      <nav>

        <a class="nav-link" href="dashboard.html">
          <span>⌂</span><span>Dashboard</span>
        </a>

        <a class="nav-link" href="arsip.html">
          <span>▣</span><span>Data Arsip</span>
        </a>

        <a class="nav-link" href="upload.html">
          <span>＋</span><span>Upload Arsip</span>
        </a>

        <a class="nav-link" href="laporan.html">
          <span>▤</span><span>Laporan</span>
        </a>

        <a class="nav-link" href="audit.html">
          <span>◷</span><span>Audit Aktivitas</span>
        </a>

        <a class="nav-link active" href="users.html">
          <span>♙</span><span>Pengguna</span>
        </a>

      </nav>

    </div>

    <div>

      <div class="user-chip">
        <div class="user-avatar" id="userAvatar">A</div>

        <div class="user-copy">
          <strong id="userRole">ADMIN</strong>
          <small>Akses aktif</small>
        </div>
      </div>

      <a class="nav-link logout-link" id="logout" href="#">
        <span>↪</span><span>Keluar</span>
      </a>

    </div>

  </aside>

  <!-- CONTENT -->
  <main class="app-content">

    <header class="topbar">

      <div>
        <h1 class="welcome-title">Pengguna</h1>

        <p class="subtitle mb-0">
          Manajemen akses pengguna
        </p>
      </div>

    </header>

    <section class="stats-grid user-stats-grid">
      <div class="glass stat-card"><div class="stat-value" id="userTotal">0</div><div class="stat-title">Total Pengguna</div></div>
      <div class="glass stat-card user-active-stat"><div class="stat-value" id="userActive">0</div><div class="stat-title">Aktif</div></div>
      <button class="user-add-button" type="button" data-bs-toggle="modal" data-bs-target="#addUserModal">♙ &nbsp;Tambah Pengguna</button>
    </section>

    <section class="content-panel user-panel">

      <div class="toolbar">

        <div>
          <h2 class="panel-title visually-hidden">Daftar Pengguna</h2>
          <input id="userSearch" class="form-control user-search" placeholder="⌕  Cari nama atau email...">
        </div>

      </div>

      <div class="table-responsive">

        <table class="table user-table align-middle">

          <thead>
            <tr>
              <th>Nama</th><th>Email</th><th>Peran</th><th>Status</th><th>Login Terakhir</th><th>Aksi</th>
            </tr>
          </thead>

          <tbody id="usersBody"><tr><td colspan="6" class="empty-state">Memuat data...</td></tr></tbody>

        </table>

      </div>

    </section>

  </main>

</div>

<div class="modal fade" id="addUserModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h2 class="modal-title">Tambah Pengguna Baru</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button></div><form id="addUserForm"><div class="modal-body user-form"><label>Nama Lengkap<input id="newUserName" class="form-control" required placeholder="Masukkan nama lengkap"></label><label>Email<input id="newUserEmail" class="form-control" type="email" required placeholder="nama@kpid.go.id"></label><label>Password<input id="newUserPassword" class="form-control" type="password" required minlength="6" placeholder="Masukkan password"></label><label>Peran<select id="newUserRole" class="form-select"><option>Viewer</option><option>Operator</option><option>Admin</option></select></label></div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button><button class="user-add-button" type="submit">Tambah Pengguna</button></div></form></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>

<script>
const usersBody=document.getElementById("usersBody");
const currentRole = localStorage.getItem("sipad_role") || "GUEST";
if(currentRole !== "ADMIN") document.querySelectorAll(".user-add-button").forEach(button=>button.hidden=true);
let userData=[];
function renderUsers(){
  const query=document.getElementById("userSearch").value.toLowerCase();
  const users=userData.filter(user=>`${user.name||""} ${user.email}`.toLowerCase().includes(query));
  document.getElementById("userTotal").textContent=userData.length;
  document.getElementById("userActive").textContent=userData.filter(user=>user.active!==false).length;
  usersBody.innerHTML=users.length?users.map(user=>{const name=user.name||user.email.split("@")[0].replace(/[._-]/g," ");const roleLabel=(user.role||"VIEWER").toLowerCase();const active=user.active!==false;const builtIn=["admin@kpid.go.id","operator@kpid.go.id","pimpinan@kpid.go.id"].includes(user.email);return `<tr><td><span class="user-row-avatar">${name.charAt(0).toUpperCase()}</span><strong>${name}</strong></td><td class="user-email">${user.email}</td><td><span class="role-badge role-${roleLabel}">${user.role||"VIEWER"}</span></td><td><span class="${active?"user-active":"user-inactive"}">● ${active?"Aktif":"Nonaktif"}</span></td><td class="user-last-login">${user.lastLogin||"-"}</td><td><button class="user-toggle-button" type="button" data-email="${user.email}" ${builtIn?"disabled title=\"Akun bawaan\"":""}>${builtIn?"Akun bawaan":active?"Nonaktifkan":"Aktifkan"}</button></td></tr>`}).join(""):"<tr><td colspan=\"6\" class=\"empty-state\">Tidak ada pengguna</td></tr>";
  usersBody.querySelectorAll(".user-toggle-button").forEach(button=>{if(currentRole !== "ADMIN")button.hidden=true;button.addEventListener("click",async()=>{try{button.disabled=true;await api.toggleUser(button.dataset.email);await loadUsers();}catch(error){notify("Gagal mengubah status",error.message,"error");button.disabled=false;}})});
}
async function loadUsers(){
  try{
    userData=await api.users();
    renderUsers();
  }catch(error){console.error("Gagal memuat pengguna",error);}
}
loadUsers();
document.getElementById("userSearch").addEventListener("input",renderUsers);
document.getElementById("addUserForm").addEventListener("submit",async event=>{event.preventDefault();const form=event.currentTarget;const button=form.querySelector("button[type=submit]");try{button.disabled=true;await api.createUser({name:document.getElementById("newUserName").value.trim(),email:document.getElementById("newUserEmail").value.trim(),password:document.getElementById("newUserPassword").value,role:document.getElementById("newUserRole").value});bootstrap.Modal.getOrCreateInstance(document.getElementById("addUserModal")).hide();form.reset();await loadUsers();notify("Berhasil","Pengguna berhasil ditambahkan.","success");}catch(error){notify("Gagal menambah pengguna",error.message,"error");}finally{button.disabled=false;}});
const role = currentRole;

document.getElementById("userRole").textContent = role;
document.getElementById("userAvatar").textContent = role.charAt(0);

document.getElementById("logout").onclick = async (e)=>{
  e.preventDefault();

  try{
    await api.logout();
  }catch(err){}

  if(window.clearSipadSession)window.clearSipadSession();else localStorage.clear();
  location.replace("login.html");
};

// Mobile sidebar toggle
(function(){
  const menu=document.getElementById("menuToggle");
  const sb=document.getElementById("sidebar");
  const ov=document.getElementById("sidebarOverlay");
  if(!menu||!sb||!ov)return;
  menu.addEventListener("click",()=>{sb.classList.toggle("show");ov.classList.toggle("show");});
  ov.addEventListener("click",()=>{sb.classList.remove("show");ov.classList.remove("show");});
})();
</script>

</body>
</html>
