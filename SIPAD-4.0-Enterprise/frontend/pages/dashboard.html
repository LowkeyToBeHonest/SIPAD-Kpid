<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | SIPAD 4.0</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <link rel="icon" href="../assets/icons/kpid-logo.jpeg">

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>

  <script>
    // Proteksi halaman
    const token = localStorage.getItem("sipad_token");
    if (!token) {
      window.location.replace("/pages/login.html");
    }
  </script>
</head>

<body class="bg-light">

  <nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">
        SIPAD 4.0 Enterprise
      </span>

      <div class="text-white">
        <span id="role"></span>

        <button class="btn btn-sm btn-light ms-3" onclick="logout()">
          Logout
        </button>
      </div>
    </div>
  </nav>

  <div class="container py-4">

    <h3 class="mb-4">Dashboard</h3>

    <div class="row g-3">

      <div class="col-md-3">
        <div class="card shadow-sm">
          <div class="card-body">
            <small>Total Arsip</small>
            <h2 id="totalArsip">-</h2>
          </div>
        </div>
      </div>

      <div class="col-md-3">
        <div class="card shadow-sm">
          <div class="card-body">
            <small>Surat Masuk</small>
            <h2 id="masuk">-</h2>
          </div>
        </div>
      </div>

      <div class="col-md-3">
        <div class="card shadow-sm">
          <div class="card-body">
            <small>Surat Keluar</small>
            <h2 id="keluar">-</h2>
          </div>
        </div>
      </div>

      <div class="col-md-3">
        <div class="card shadow-sm">
          <div class="card-body">
            <small>Laporan</small>
            <h2 id="laporan">-</h2>
          </div>
        </div>
      </div>

    </div>

    <div class="card mt-4 shadow-sm">
      <div class="card-header">
        Arsip Terbaru
      </div>

      <div class="table-responsive">
        <table class="table mb-0">
          <thead>
            <tr>
              <th>Nomor</th>
              <th>Judul</th>
              <th>Kategori</th>
            </tr>
          </thead>

          <tbody id="tbody">
            <tr>
              <td colspan="3" class="text-center py-4">
                Memuat data...
              </td>
            </tr>
          </tbody>

        </table>
      </div>
    </div>

  </div>

  <script>
    document.getElementById("role").textContent =
      localStorage.getItem("sipad_role") || "GUEST";

    async function loadDashboard(){

      try{

        const data = await api.list();

        document.getElementById("totalArsip").textContent = data.length;
        document.getElementById("masuk").textContent =
          data.filter(x=>x.kategori==="Surat Masuk").length;

        document.getElementById("keluar").textContent =
          data.filter(x=>x.kategori==="Surat Keluar").length;

        document.getElementById("laporan").textContent =
          data.filter(x=>x.kategori==="Laporan" || x.kategori==="Dokumentasi").length;

        const tbody = document.getElementById("tbody");
        tbody.innerHTML = "";

        data.slice(-5).reverse().forEach(item=>{

          tbody.innerHTML += `
            <tr>
              <td>${item.nomor}</td>
              <td>${item.judul}</td>
              <td>${item.kategori}</td>
            </tr>
          `;

        });

      }catch(err){

        document.getElementById("tbody").innerHTML = `
          <tr>
            <td colspan="3" class="text-danger text-center py-4">
              ${err.message}
            </td>
          </tr>
        `;

      }

    }

    async function logout(){

      try{
        await api.logout();
      }catch(e){}

      localStorage.clear();
      window.location.replace("/pages/login.html");

    }

    loadDashboard();
  </script>

</body>
</html>
