<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audit Aktivitas | SIPAD</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <link href="../css/bootstrap-custom.css" rel="stylesheet">
  <script src="../js/theme.js"></script>
  <script src="../js/auth-guard.js"></script>
  <script>guardSession();</script>

  <link rel="icon" type="image/jpeg" href="../assets/icons/kpid-logo.jpeg">
</head>

<body>
<!-- Mobile Menu -->
<button id="menuToggle" class="mobile-menu-btn" aria-label="Buka menu">☰</button>
<div id="sidebarOverlay" class="sidebar-overlay"></div>

<div class="app-shell">

  <!-- SIDEBAR -->
 <aside class="app-sidebar" id="sidebar">

    <div>

      <div class="brand">
        <div class="brand-mark">
          <img src="../assets/icons/kpid-logo.jpeg" alt="Logo KPID">
        </div>

        <div class="brand-copy">
          <strong>SIPAD</strong>
          <small>Enterprise 4.0</small>
        </div>
      </div>

      <div class="sidebar-label">WORKSPACE</div>

      <nav>

        <a class="nav-link" href="dashboard.html">
          <span>⌂</span><span>Dashboard</span>
        </a>

        <a class="nav-link" href="arsip.html">
          <span>▣</span><span>Data Arsip</span>
        </a>

        <a class="nav-link" href="upload.html">
          <span>＋</span><span>Upload Arsip</span>
        </a>

        <a class="nav-link" href="laporan.html">
          <span>▤</span><span>Laporan</span>
        </a>

        <a class="nav-link active" href="audit.html">
          <span>◷</span><span>Audit Aktivitas</span>
        </a>

        <a class="nav-link" href="users.html">
          <span>♙</span><span>Pengguna</span>
        </a>

      </nav>

    </div>

    <div>

      <div class="user-chip">
        <div class="user-avatar" id="userAvatar">A</div>

        <div class="user-copy">
          <strong id="userRole">ADMIN</strong>
          <small>Akses aktif</small>
        </div>
      </div>

      <a class="nav-link logout-link" id="logout" href="#">
        <span>↪</span><span>Keluar</span>
      </a>

    </div>

  </aside>

  <!-- CONTENT -->
  <main class="app-content">

    <header class="topbar">

      <div>
        <h1 class="welcome-title">Audit Aktivitas</h1>

        <p class="subtitle mb-0">
          Riwayat aktivitas sistem
        </p>
      </div>


    </header>

    <section class="stats-grid audit-stats-grid">
      <div class="glass stat-card audit-total"><div class="stat-icon">⌁</div><div class="stat-title">Total Aktivitas</div><div class="stat-value" id="auditTotal">0</div></div>
      <div class="glass stat-card audit-success"><div class="stat-icon">♢</div><div class="stat-title">Berhasil</div><div class="stat-value" id="auditSuccess">0</div></div>
      <div class="glass stat-card audit-failed"><div class="stat-icon">⊗</div><div class="stat-title">Gagal</div><div class="stat-value" id="auditFailed">0</div></div>
    </section>

    <section class="content-panel audit-panel">

      <div class="toolbar">

        <div>
          <h2 class="panel-title">Riwayat Aktivitas</h2>
          <div class="audit-filters"><input id="auditSearch" class="form-control" placeholder="⌕  Cari pengguna atau aksi..."><select id="auditStatus" class="form-select"><option value="">Semua</option><option value="Berhasil">Berhasil</option><option value="Gagal">Gagal</option></select></div>
        </div>

        <button class="btn btn-outline-primary audit-refresh" onclick="loadAudit()">
          ↻ Refresh
        </button>

      </div>

      <div class="table-responsive">

        <table class="table align-middle">

          <thead>
            <tr>
              <th>Pengguna</th>
              <th>Aksi</th>
              <th>Detail</th><th>Waktu</th><th>IP</th><th>Status</th>
            </tr>
          </thead>

          <tbody id="tbody">
            <tr>
              <td colspan="6" class="text-center text-muted py-4">
                Memuat data...
              </td>
            </tr>
          </tbody>

        </table>

      </div>

    </section>

  </main>

</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/audit-page.js"></script>

<script>
const role = localStorage.getItem("sipad_role") || "ADMIN";

document.getElementById("userRole").textContent = role;
document.getElementById("userAvatar").textContent = role.charAt(0);

document.getElementById("logout").onclick = async function(e){
  e.preventDefault();

  try{
    await api.logout();
  }catch(e){}

  if(window.clearSipadSession)window.clearSipadSession();else localStorage.clear();
  location.replace("login.html");
};

// Mobile sidebar toggle
(function(){
  const menu=document.getElementById("menuToggle");
  const sb=document.getElementById("sidebar");
  const ov=document.getElementById("sidebarOverlay");
  if(!menu||!sb||!ov)return;
  menu.addEventListener("click",()=>{sb.classList.toggle("show");ov.classList.toggle("show");});
  ov.addEventListener("click",()=>{sb.classList.remove("show");ov.classList.remove("show");});
})();
</script>

</body>
</html>
