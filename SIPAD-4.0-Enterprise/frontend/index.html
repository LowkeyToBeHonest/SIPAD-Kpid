<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIPAD - Redirect</title>

  <script>
    (function () {
      const token = localStorage.getItem("sipad_token");

      if (token) {
        window.location.replace("/pages/dashboard.html");
      } else {
        window.location.replace("/pages/login.html");
      }
    })();
  </script>
</head>

<body style="display:flex;justify-content:center;align-items:center;height:100vh;font-family:Arial,sans-serif;background:#f5f7fb;">
  <div style="text-align:center;">
    <div style="width:42px;height:42px;border:4px solid #ddd;border-top:4px solid #0d6efd;border-radius:50%;animation:spin 1s linear infinite;margin:auto;"></div>
    <p style="margin-top:16px;color:#666;">Mengalihkan...</p>
  </div>

  <style>
    @keyframes spin{
      from{transform:rotate(0deg)}
      to{transform:rotate(360deg)}
    }
  </style>
</body>
</html>
